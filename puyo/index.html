<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぷよ連鎖練習場</title><meta name="theme-color" content="#1b130f"><style>*{box-sizing:border-box}:root{color-scheme:dark;font-family:system-ui,"Yu Gothic UI",sans-serif;color:#fff0df;background:#1b130f}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 48% 0%,#62351e 0%,transparent 62%),#1b130f}main{width:min(620px,calc(100% - 32px));margin:auto;padding:24px 0 36px}.nav{font-size:12px;color:#d3b9a5;margin-bottom:24px}.nav a,a{color:#e9a365}.eyebrow{font-size:11px;letter-spacing:.24em;font-weight:800;color:#e9a365;margin:0 0 8px}h1{font-size:clamp(29px,4vw,52px);letter-spacing:-.05em;margin:0 0 10px;line-height:1.18}small{color:#d3b9a5;line-height:1.65}.panel{margin-top:22px;background:linear-gradient(150deg,#362318,#2b1d15);border:1px solid #67432d;border-radius:20px;overflow:hidden;box-shadow:0 24px 55px #0004;padding:clamp(10px,3vw,22px)}button,select{font:inherit;color:inherit;background:#49301f;border:1px solid #80553b;border-radius:8px;padding:9px 11px;cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}button:focus-visible,select:focus-visible{outline:2px solid #ffe0ad;outline-offset:2px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;background:#21170f;padding:8px;border:1px solid #67432d;border-radius:13px;width:min(100%,300px);margin:auto}.cell{aspect-ratio:1;padding:0;min-width:0;border:1px solid #67432d;background:#302218;border-radius:50%;font-weight:bold}.cell:not(.c0),.mini{box-shadow:inset 0 2px #fff5,inset 0 -3px #0002,0 2px 4px #0005}.c1{background:#e17e83;color:#26170d}.c2{background:#60bdad;color:#142b24}.c3{background:#819bdc;color:#172234}.c4{background:#ffe3a4;color:#26170d}.ghost{outline:2px dashed #ffe0ad;opacity:.65}.flash{outline:3px solid white;opacity:.4}.mini{display:inline-block;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin:2px;font-weight:bold}.stats{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;margin:12px 0;color:#dcc3ae}#status{min-height:48px;line-height:1.5;color:#d3b9a5;border-top:1px solid #67432d;padding-top:12px}button[aria-pressed=true]{outline:2px solid #ffe0ad}#controls button{flex:1;white-space:nowrap}#drop{background:#e9a365;color:#26170d;font-weight:750;border-color:#e9a365}kbd{font:inherit;color:#ffe0ad}footer{margin-top:15px;font-size:13px}#fall[aria-checked=true]{background:#e9a365;color:#26170d;font-weight:750}.active{outline:2px solid #fff0df;outline-offset:-2px}</style><main><nav class="nav"><a href="../">MIOGameTools</a> / 連鎖パズル</nav><header><p class="eyebrow">PUZZLE · CHAIN PRACTICE</p><h1>ぷよ連鎖練習場</h1><small>非公式・自由落下を切り替えられる簡易シミュレータ</small></header><section class="panel"><div class="row"><select id="mode" aria-label="練習モード"><option value="2">自由練習</option><option value="3">連鎖実験室</option></select><button id="reset">リセット</button><button id="undo">W 一手戻す</button></div><div class="row" id="fallrow"><button id="fall" role="switch" aria-checked="false">自由落下：OFF</button></div><div id="status" role="status"></div><div class="stats"><span id="pair"></span><span id="stats"></span></div><div id="board" class="board" aria-label="盤面"></div><div id="controls" class="row"><button id="left">A 左</button><button id="right">D 右</button><button id="rotate">E 回転</button><button id="drop">S 落下</button><button id="hint">ヒント</button></div><div id="edit" class="row" hidden></div></section><footer><p><small>PC：A 左、S 落下、D 右、E 回転、W 一手戻す。矢印キーも使えます。自由落下ONでは約0.65秒ごとに1段下降し、着地で自動確定します。Sは即落下です。上下左右に同色が4個以上つながると消えます。記号は色の識別用です。実験室ではマスを押して色を置けます。</small></p><p><small>練習専用：6×12、隠し段・対戦・正式得点なし。<a href="https://puyo.sega.jp/puyopuyotetris/mode/lesson/index.html">基本ルール参考（SEGA）</a></small></p></footer></main><script>
'use strict';const $=id=>document.getElementById(id), W=6,H=12, symbols=['','●','▲','■','◆'], clone=x=>JSON.parse(JSON.stringify(x)), blank=()=>Array.from({length:H},()=>Array(W).fill(0));let b,pair,next,nextNext,x,rot,best,last,history,busy=false,done=false,paint=1,auto=false,y=1;
const random=()=>Array.from({length:2},()=>1+Math.floor(Math.random()*4)),mode=()=>+$('mode').value,delay=ms=>new Promise(r=>setTimeout(r,ms));
function gravity(a){for(let c=0;c<W;c++){let v=a.map(r=>r[c]).filter(Boolean);for(let r=0;r<H;r++)a[r][c]=r<H-v.length?0:v[r-H+v.length]}}
function groups(a){let seen=new Set(),out=[];for(let r=0;r<H;r++)for(let c=0;c<W;c++){let k=r*W+c;if(!a[r][c]||seen.has(k))continue;let q=[[r,c]];seen.add(k);for(let i=0;i<q.length;i++){let [y,x]=q[i];for(let [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){let yy=y+dy,xx=x+dx,kk=yy*W+xx;if(yy>=0&&yy<H&&xx>=0&&xx<W&&a[yy][xx]===a[r][c]&&!seen.has(kk)){seen.add(kk);q.push([yy,xx])}}}if(q.length>=4)out.push(...q)}return out}
function placement(a,col,dir,p){let v=clone(a), dx=[0,1,0,-1][dir], c2=col+dx;if(c2<0||c2>=W)return null;let spots=[];function put(c,k){let r=H-1;while(r>=0&&v[r][c])r--;if(r<0)return false;v[r][c]=k;spots.push([r,c,k]);return true}let ok=dir===2?put(c2,p[1])&&put(col,p[0]):put(col,p[0])&&put(c2,p[1]);return ok?{v,spots}:null}
function falling(col=x,dir=rot,row=y){let dx=[0,1,0,-1][dir],dy=[-1,0,1,0][dir];return [[row,col,pair[0]],[row+dy,col+dx,pair[1]]]}
function valid(col=x,dir=rot,row=y){return falling(col,dir,row).every(([r,c])=>r>=0&&r<H&&c>=0&&c<W&&!b[r][c])}
function toggle(){if(busy||mode()!==2||done)return;auto=!auto;y=1;x=2;rot=0;if(auto&&!valid()){auto=false;say('出現位置が埋まっています。')}else say(auto?'自由落下 ON：Sで即落下。':'自由落下 OFF：時間制限なし。');render()}
function say(s){$('status').textContent=s}function render(flash=[]){let g=new Map(),active=new Map();if(auto&&mode()===2&&!done&&!busy&&valid())for(let [r,c,k] of falling())active.set(r*W+c,k);if(mode()!==3&&!done&&!busy){let z=placement(b,x,rot,pair);if(z)for(let [r,c,k] of z.spots)g.set(r*W+c,k)}$('board').replaceChildren();for(let r=0;r<H;r++)for(let c=0;c<W;c++){let el=document.createElement('button'),k=b[r][c]||active.get(r*W+c)||g.get(r*W+c)||0;el.className='cell c'+k+(active.has(r*W+c)?' active':g.has(r*W+c)?' ghost':'')+(flash.some(([y,x])=>y===r&&x===c)?' flash':'');el.textContent=symbols[k];el.setAttribute('aria-label',`${r+1}行${c+1}列 ${['空','赤','緑','青','黄'][k]}`);el.disabled=busy;el.onclick=()=>{if(busy)return;if(mode()===3){save();b[r][c]=paint}else if(!done){let old=x;x=c;fit();if(auto&&!valid())x=old}render()};$('board').append(el)}$('pair').innerHTML=mode()===3?'盤面編集':'現在 '+pair.map(k=>'<span class="mini c'+k+'">'+symbols[k]+'</span>').join('')+' NEXT '+next.map(k=>'<span class="mini c'+k+'">'+symbols[k]+'</span>').join('')+' NEXT NEXT '+nextNext.map(k=>'<span class="mini c'+k+'">'+symbols[k]+'</span>').join('');$('stats').textContent='直前 '+last+' / 最大 '+best+' 連鎖';$('fallrow').style.display=mode()===2?'flex':'none';$('fall').textContent='自由落下：'+(auto?'ON':'OFF');$('fall').setAttribute('aria-checked',String(auto));$('fall').disabled=busy||done;$('controls').style.display=mode()===3?'none':'flex';$('edit').style.display=mode()===3?'flex':'none';for(let id of ['mode','reset','undo','left','right','rotate','drop','hint'])$(id).disabled=busy||(['left','right','rotate','drop','hint'].includes(id)&&done)||(id==='undo'&&!history.length);for(let el of $('edit').querySelectorAll('button'))el.disabled=busy}
function init(){if(busy)return;b=blank();pair=random();next=random();nextNext=random();x=2;rot=0;y=1;best=last=0;history=[];done=false;say(mode()===2?'自由に積んで連鎖を狙おう。':'色を選んで盤面を編集し、連鎖を実行。');render()}
function save(){history.push(clone({b,pair,next,nextNext,x,rot,y,best,last,done}));if(history.length>100)history.shift()}
function undo(){if(busy||!history.length)return;({b,pair,next,nextNext,x,rot,y,best,last,done}=history.pop());if(auto&&mode()===2&&!valid()){x=2;rot=0;y=1;if(!valid())auto=false}say('一手戻しました。');render()}
function fit(){if(rot===1)x=Math.min(x,4);if(rot===3)x=Math.max(x,1)}
async function resolve(){gravity(b);let n=0;while(true){let cells=groups(b);if(!cells.length)break;n++;say(n+'連鎖！ '+cells.length+'個消去');render(cells);await delay(450);for(let [r,c]of cells)b[r][c]=0;render();await delay(180);gravity(b);render();await delay(300)}last=n;best=Math.max(best,n);return n}
async function drop(){if(busy||done)return;let z=placement(b,x,rot,pair);if(!z){say('ここには置けません。');return}save();busy=true;b=z.v;render();let n=await resolve();{pair=next;next=nextNext;nextNext=random();if(auto){x=2;rot=0;y=1;}if((auto&&!valid())||b[0][2]||!Array.from({length:6},(_,c)=>[0,1,2,3].some(d=>placement(b,c,d,pair))).some(Boolean)){done=true;say('ゲーム終了。一手戻すかリセットできます。')}else say(n?n+'連鎖成功！':'次の組ぷよを置こう。')}busy=false;render()}
function hint(){let bestMove=null;for(let c=0;c<W;c++)for(let d=0;d<4;d++){let z=placement(b,c,d,pair);if(!z)continue;let n=0;while(true){let cells=groups(z.v);if(!cells.length)break;n++;for(let [r,c]of cells)z.v[r][c]=0;gravity(z.v)}if(!bestMove||n>bestMove.n)bestMove={c,d,n}}if(bestMove){if(auto&&!valid(bestMove.c,bestMove.d,y)){say("落下中はその位置に移動できません。");return}x=bestMove.c;rot=bestMove.d;say(bestMove.n?'この位置なら '+bestMove.n+'連鎖。':'今すぐ消える置き方はありません。先の連鎖を準備しよう。');render()}}
function move(d){if(busy||done||mode()===3)return;let old=x;x=Math.max(0,Math.min(W-1,x+d));fit();if(auto&&!valid())x=old;render()}function rotate(){if(busy||done||mode()===3)return;let old=x,dir=rot;rot=(rot+1)%4;fit();if(auto&&!valid()){x=old;rot=dir}render()}
$('fall').onclick=toggle;$('mode').onchange=init;$('reset').onclick=init;$('undo').onclick=undo;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('rotate').onclick=rotate;$('drop').onclick=drop;$('hint').onclick=hint;
for(let k=0;k<=4;k++){let el=document.createElement('button');el.textContent=k?symbols[k]:'消しゴム';el.className='c'+k;el.setAttribute('aria-label',['消しゴム','赤','緑','青','黄'][k]);el.setAttribute('aria-pressed',String(k===paint));el.onclick=()=>{paint=k;for(let v of $('edit').querySelectorAll('[aria-pressed]'))v.setAttribute('aria-pressed',String(v===el))};$('edit').append(el)}let run=document.createElement('button');run.textContent='連鎖実行';run.onclick=async()=>{if(busy)return;save();busy=true;render();let n=await resolve();busy=false;say(n+'連鎖。自由に編集して再挑戦できます。');render()};$('edit').append(run);
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing||document.activeElement.tagName==='SELECT')return;let k=e.key.toLowerCase();if(k===' '&&document.activeElement.tagName==='BUTTON')return;if(busy)return;if(k==='w'){e.preventDefault();if(!e.repeat)undo();return}if(mode()===3)return;let fn={a:()=>move(-1),d:()=>move(1),e:rotate,s:drop,arrowleft:()=>move(-1),arrowright:()=>move(1),arrowup:rotate,arrowdown:drop,' ':drop}[k];if(fn){e.preventDefault();if(!e.repeat||['a','d','arrowleft','arrowright'].includes(k))fn()}});init();setInterval(()=>{if(!auto||mode()!==2||busy||done||document.hidden)return;if(valid(x,rot,y+1)){y++;render()}else drop()},650);
</script></html>
