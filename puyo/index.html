<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぷよ連鎖練習場</title><style>
*{box-sizing:border-box}body{background:#091529;color:#eef6ff;font:16px system-ui;margin:0}main{max-width:520px;margin:auto;padding:16px}a{color:#8ed8ff}h1{font-size:24px}button,select{font:inherit;color:inherit;background:#203b59;border:1px solid #547394;border-radius:9px;padding:10px;cursor:pointer}button:disabled{opacity:.45}button:focus-visible{outline:3px solid white}.row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#07101d;padding:6px;border:1px solid #45617b;border-radius:12px;max-width:300px;margin:auto}.cell{aspect-ratio:1;padding:0;min-width:0;border:1px solid #24374c;background:#112138;border-radius:50%;font-weight:bold}.c1{background:#e64d61;color:white}.c2{background:#35a85b;color:white}.c3{background:#327cdb;color:white}.c4{background:#f4cd42;color:#172234}.ghost{outline:2px dashed white;opacity:.65}.flash{outline:3px solid white;opacity:.4}.mini{display:inline-block;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin:2px;font-weight:bold}.stats{display:flex;justify-content:space-between;font-size:14px;margin:8px 0}small{color:#b9cadb}#status{min-height:48px;line-height:1.5}button[aria-pressed=true]{border:2px solid #fff} </style><main><a href="../">← MioGameTools</a><h1>ぷよ連鎖練習場</h1><small>非公式・時間制限なしの簡易シミュレータ</small><div class="row"><select id="mode" aria-label="練習モード"><option value="0">入門：4個消し</option><option value="1">入門：2連鎖</option><option value="2">自由練習</option><option value="3">連鎖実験室</option></select><button id="reset">リセット</button><button id="undo">一手戻す</button></div><div id="status" role="status"></div><div class="stats"><span id="pair"></span><span id="stats"></span></div><div id="board" class="board" aria-label="盤面"></div><div id="controls" class="row"><button id="left">← 左</button><button id="right">右 →</button><button id="rotate">↻ 回転</button><button id="drop">落とす ↓</button><button id="hint">ヒント</button></div><div id="edit" class="row" hidden></div><p><small>PC：← → 移動、↑ 回転、↓ または Space で落下。上下左右に同色が4個以上つながると消えます。記号は色の識別用です。実験室ではマスを押して色を置けます。</small></p><p><small>練習専用：6×12、隠し段・対戦・正式得点なし。<a href="https://puyo.sega.jp/puyopuyotetris/mode/lesson/index.html">基本ルール参考（SEGA）</a></small></p></main><script>
'use strict';const $=id=>document.getElementById(id), W=6,H=12, symbols=['','●','▲','■','◆'], clone=x=>JSON.parse(JSON.stringify(x)), blank=()=>Array.from({length:H},()=>Array(W).fill(0));let b,pair,next,x,rot,best,last,history,busy=false,done=false,paint=1;
const random=()=>Array.from({length:2},()=>1+Math.floor(Math.random()*4)),mode=()=>+$('mode').value,delay=ms=>new Promise(r=>setTimeout(r,ms));
function gravity(a){for(let c=0;c<W;c++){let v=a.map(r=>r[c]).filter(Boolean);for(let r=0;r<H;r++)a[r][c]=r<H-v.length?0:v[r-H+v.length]}}
function groups(a){let seen=new Set(),out=[];for(let r=0;r<H;r++)for(let c=0;c<W;c++){let k=r*W+c;if(!a[r][c]||seen.has(k))continue;let q=[[r,c]];seen.add(k);for(let i=0;i<q.length;i++){let [y,x]=q[i];for(let [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){let yy=y+dy,xx=x+dx,kk=yy*W+xx;if(yy>=0&&yy<H&&xx>=0&&xx<W&&a[yy][xx]===a[r][c]&&!seen.has(kk)){seen.add(kk);q.push([yy,xx])}}}if(q.length>=4)out.push(...q)}return out}
function placement(a,col,dir,p){let v=clone(a), dx=[0,1,0,-1][dir], c2=col+dx;if(c2<0||c2>=W)return null;let spots=[];function put(c,k){let r=H-1;while(r>=0&&v[r][c])r--;if(r<0)return false;v[r][c]=k;spots.push([r,c,k]);return true}let ok=dir===2?put(c2,p[1])&&put(col,p[0]):put(col,p[0])&&put(c2,p[1]);return ok?{v,spots}:null}
function say(s){$('status').textContent=s}function render(flash=[]){let g=new Map();if(mode()!==3&&!done&&!busy){let z=placement(b,x,rot,pair);if(z)for(let [r,c,k] of z.spots)g.set(r*W+c,k)}$('board').replaceChildren();for(let r=0;r<H;r++)for(let c=0;c<W;c++){let el=document.createElement('button'),k=b[r][c]||g.get(r*W+c)||0;el.className='cell c'+k+(g.has(r*W+c)?' ghost':'')+(flash.some(([y,x])=>y===r&&x===c)?' flash':'');el.textContent=symbols[k];el.setAttribute('aria-label',`${r+1}行${c+1}列 ${['空','赤','緑','青','黄'][k]}`);el.disabled=busy;el.onclick=()=>{if(busy)return;if(mode()===3){save();b[r][c]=paint}else{x=c;fit()}render()};$('board').append(el)}$('pair').innerHTML=mode()===3?'盤面編集':'現在 '+pair.map(k=>'<span class="mini c'+k+'">'+symbols[k]+'</span>').join('')+' 次 '+next.map(k=>'<span class="mini c'+k+'">'+symbols[k]+'</span>').join('');$('stats').textContent='直前 '+last+' / 最大 '+best+' 連鎖';$('controls').style.display=mode()===3?'none':'flex';$('edit').style.display=mode()===3?'flex':'none';for(let id of ['mode','reset','undo','left','right','rotate','drop','hint'])$(id).disabled=busy||(['left','right','rotate','drop','hint'].includes(id)&&done)||(id==='undo'&&!history.length);for(let el of $('edit').querySelectorAll('button'))el.disabled=busy}
function init(){if(busy)return;b=blank();pair=random();next=random();x=2;rot=0;best=last=0;history=[];done=false;if(mode()===0){b[11][0]=b[11][1]=b[11][2]=1;pair=[1,2];say('赤を3個置いてあります。赤をもう1個つなげよう。')}else if(mode()===1){b[11][0]=b[11][1]=b[11][2]=1;b[10][0]=b[10][1]=b[10][2]=2;b[11][3]=2;pair=[1,1];say('赤を消すと緑が落ちます。2連鎖を狙いましょう。')}else say(mode()===2?'自由に積んで連鎖を狙おう。':'色を選んで盤面を編集し、連鎖を実行。');render()}
function save(){history.push(clone({b,pair,next,x,rot,best,last,done}));if(history.length>100)history.shift()}
function undo(){if(busy||!history.length)return;({b,pair,next,x,rot,best,last,done}=history.pop());say('一手戻しました。');render()}
function fit(){if(rot===1)x=Math.min(x,4);if(rot===3)x=Math.max(x,1)}
async function resolve(){gravity(b);let n=0;while(true){let cells=groups(b);if(!cells.length)break;n++;say(n+'連鎖！ '+cells.length+'個消去');render(cells);await delay(450);for(let [r,c]of cells)b[r][c]=0;render();await delay(180);gravity(b);render();await delay(300)}last=n;best=Math.max(best,n);return n}
async function drop(){if(busy||done)return;let z=placement(b,x,rot,pair);if(!z){say('ここには置けません。');return}save();busy=true;b=z.v;render();let n=await resolve();if(mode()<2){done=true;say(n>=mode()+1?'クリア！ '+n+'連鎖。次の練習へ進もう。':'惜しい！ 一手戻して試してみよう。')}else{pair=next;next=random();if(b[0][2]||!Array.from({length:6},(_,c)=>[0,1,2,3].some(d=>placement(b,c,d,pair))).some(Boolean)){done=true;say('ゲーム終了。一手戻すかリセットできます。')}else say(n?n+'連鎖成功！':'次の組ぷよを置こう。')}busy=false;render()}
function hint(){let bestMove=null;for(let c=0;c<W;c++)for(let d=0;d<4;d++){let z=placement(b,c,d,pair);if(!z)continue;let n=0;while(true){let cells=groups(z.v);if(!cells.length)break;n++;for(let [r,c]of cells)z.v[r][c]=0;gravity(z.v)}if(!bestMove||n>bestMove.n)bestMove={c,d,n}}if(bestMove){x=bestMove.c;rot=bestMove.d;say(bestMove.n?'この位置なら '+bestMove.n+'連鎖。':'今すぐ消える置き方はありません。先の連鎖を準備しよう。');render()}}
function move(d){if(busy||done||mode()===3)return;x=Math.max(0,Math.min(W-1,x+d));fit();render()}function rotate(){if(busy||done||mode()===3)return;rot=(rot+1)%4;fit();render()}
$('mode').onchange=init;$('reset').onclick=init;$('undo').onclick=undo;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('rotate').onclick=rotate;$('drop').onclick=drop;$('hint').onclick=hint;
for(let k=0;k<=4;k++){let el=document.createElement('button');el.textContent=k?symbols[k]:'消しゴム';el.className='c'+k;el.setAttribute('aria-label',['消しゴム','赤','緑','青','黄'][k]);el.setAttribute('aria-pressed',String(k===paint));el.onclick=()=>{paint=k;for(let v of $('edit').querySelectorAll('[aria-pressed]'))v.setAttribute('aria-pressed',String(v===el))};$('edit').append(el)}let run=document.createElement('button');run.textContent='連鎖実行';run.onclick=async()=>{if(busy)return;save();busy=true;render();let n=await resolve();busy=false;say(n+'連鎖。自由に編集して再挑戦できます。');render()};$('edit').append(run);
document.addEventListener('keydown',e=>{if(['SELECT','BUTTON'].includes(document.activeElement.tagName)&&e.key===' ')return;if(busy||mode()===3)return;let fn={'ArrowLeft':()=>move(-1),'ArrowRight':()=>move(1),'ArrowUp':rotate,'ArrowDown':drop,' ':drop}[e.key];if(fn){e.preventDefault();fn()}});init();
</script></html>
